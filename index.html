<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <title>Momentum</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <section id="homePage" class="page">
                <div id="homePageContent" class="pageContentWrapper">
                    <label class="preheading">Monday, 26 October</label>
                    <h1 class="heading">Momentum</h1>
                    <div class="contentBox">
                        <div id="goalsBoxContentWrapper">
                            <div id="outerProgressRing">
                                <div id="innerProgressRing">
                                    <h1 id="progressValue">68</h1>
                                    <p id="percentageIcon">%</p>
                                </div>
                            </div>
                            <div id="goalsBoxTextWrapper">
                                <p id="goalsBoxTitle">STRENGTH GOALS</p>
                                <p id="goalsBoxLine">Next goal</p>
                                <p id="goalsBoxNextGoal">Bench press 100 kg</p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
