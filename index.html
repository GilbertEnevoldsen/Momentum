<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <title>Momentum</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main>
            <section id="homePage" class="page">
                <div id="homePageContent" class="pageContentWrapper">
                    <label class="preheading">Monday, 26 October</label>
                    <h1 class="heading">Momentum</h1>
                    <div id="goalsBox" class="contentBox">
                        <!-- <div id="goalsBoxContentWrapper"> -->
                            <div id="outerProgressRing">
                                <div id="innerProgressRing">
                                    <h1 id="progressValue">68</h1>
                                    <p id="percentageIcon">%</p>
                                </div>
                            </div>
                            <div id="goalsBoxTextWrapper">
                                <p id="goalsBoxTitle">STRENGTH GOALS</p>
                                <p id="goalsBoxLine">Next goal</p>
                                <p id="goalsBoxNextGoal">Bench press 100 kg</p>
                            </div>
                        <!-- </div> -->
                    </div>
                    <div id="scheduleBox" class="contentBox">

                        <div class="scheduleDay activeDay">
                            <p class="scheduleWeekday">Mon</p>
                            <p class="scheduleDate">26</p>
                            <p class="scheduleIconFilled">P</p>
                            <p class="scheduleName">Push</p>
                        </div>

                        <div class="scheduleDay">
                            <p class="scheduleWeekday">Tue</p>
                            <p class="scheduleDate">27</p>
                            <p class="scheduleIcon"></p>
                            <p class="scheduleName">Rest</p>
                        </div>

                        <div class="scheduleDay">
                            <p class="scheduleWeekday">Wed</p>
                            <p class="scheduleDate">28</p>
                            <p class="scheduleIcon"></p>
                            <p class="scheduleName">Rest</p>
                        </div>

                        <div class="scheduleDay">
                            <p class="scheduleWeekday">Thu</p>
                            <p class="scheduleDate">29</p>
                            <p class="scheduleIconFilled">P</p>
                            <p class="scheduleName">Pull</p>
                        </div>

                        <div class="scheduleDay">
                            <p class="scheduleWeekday">Fri</p>
                            <p class="scheduleDate">30</p>
                            <p class="scheduleIconFilled">L</p>
                            <p class="scheduleName">Legs</p>
                        </div>

                        <div class="scheduleDay">
                            <p class="scheduleWeekday">Sat</p>
                            <p class="scheduleDate">31</p>
                            <p class="scheduleIcon"></p>
                            <p class="scheduleName">Rest</p>
                        </div>

                        <div class="scheduleDay">
                            <p class="scheduleWeekday">Sun</p>
                            <p class="scheduleDate">1</p>
                            <p class="scheduleIcon"></p>
                            <p class="scheduleName">Rest</p>
                        </div>

                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
